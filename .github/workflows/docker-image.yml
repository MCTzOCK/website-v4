name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  push_to_registry:
    name: Push Docker image to Docker Registry
    runs-on: self-hosted
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Build Docker Image
        run: docker build -t registry.ben-siebert.com/ben/website-v4 .
      - name: Push Docker Image
        run: docker push registry.ben-siebert.com/ben/website-v4
